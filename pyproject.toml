[project]
name = "napari-behavior-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christoph Sommer", email = "christoph.sommer@ista.ac.at" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "magicgui>=0.10.2",
    "napari[pyqt]>=0.8.0",
    "opencv-python-headless>=4.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "sleap-io>=0.9.1",
    "xarray>=2026.7.0",
]

[project.entry-points."napari.manifest"]
napari-behavior-classifier = "napari_behavior_classifier:napari.yaml"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napari_behavior_classifier"]

[tool.hatch.build.targets.wheel.force-include]
"src/napari_behavior_classifier/napari.yaml" = "napari_behavior_classifier/napari.yaml"
